name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated native project and assets
        run: |
          python3 apps/ios/generate-project.py
          git diff --exit-code -- apps/ios
      - name: Build native app and run unit tests
        run: |
          device=$(python3 - <<'PY'
          import json, pathlib, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          runtime_id, device = next((runtime_id, device) for runtime_id, devices in devices.items() for device in devices if device["name"].startswith("iPhone"))
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          runtime = next(runtime for runtime in runtimes if runtime["identifier"] == runtime_id)
          root = pathlib.Path(runtime["runtimeRoot"])
          library = pathlib.Path("usr/lib/swift/libswiftWebKit.dylib")
          source = root / "System/Cryptexes/OS" / library
          # iOS 18.4/18.5 omit the compatibility path for Swift WebKit APIs.
          # Expose this runtime's own library through the test loader search path.
          # https://bugs.webkit.org/show_bug.cgi?id=293831
          if not (root / library).exists() and source.is_file():
              destination = pathlib.Path("apps/ios/build/Build/Products/Debug-iphonesimulator") / library.name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.unlink(missing_ok=True)
              destination.symlink_to(source)
          print(device["udid"])
          PY
          )
          xcodebuild -project apps/ios/Roost.xcodeproj -scheme Roost -destination "platform=iOS Simulator,id=$device" -derivedDataPath apps/ios/build -only-testing:RoostTests test
