name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated native project and assets
        run: |
          python3 apps/ios/generate-project.py
          git diff --exit-code -- apps/ios
      - name: Build native app and run unit tests
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project apps/ios/Roost.xcodeproj -scheme Roost -destination "platform=iOS Simulator,id=$device" -derivedDataPath apps/ios/build -only-testing:RoostTests test
