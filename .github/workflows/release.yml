name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package pinned runtimes and application
        run: ROOST_VERSION="${GITHUB_REF_NAME#v}" pnpm release:pack
      - name: Create draft, upload artifacts, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Roost ${GITHUB_REF_NAME#v}" --generate-notes dist/roost-linux-x64.tar.gz dist/SHA256SUMS dist/install.sh
          gh release edit "$GITHUB_REF_NAME" --draft=false
